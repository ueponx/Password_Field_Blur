<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>パスワードフィールドぼかし</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #2196F3;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .status {
      margin-left: 10px;
      font-weight: bold;
    }
    
    .status-text {
      font-size: 14px;
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>パスワードフィールドぼかし</h1>
    
    <div class="toggle-container">
      <label class="toggle-switch">
        <input type="checkbox" id="blurToggle">
        <span class="slider"></span>
      </label>
      <span class="status" id="statusText">オフ</span>
    </div>
    
    <p class="status-text" id="descriptionText">
      パスワードフィールドのぼかしは現在無効です
    </p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
